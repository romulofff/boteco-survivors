<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boteco" />
    <meta name="theme-color" content="#0d0b0e" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Boteco Survivors</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #0d0b0e;
        position: fixed; inset: 0;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #game { display: block; position: absolute; left: 0; top: 0; touch-action: none; image-rendering: auto; }
      /* celular em retrato: cobre o jogo e absorve os toques (main.ts pausa a run) */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        align-items: center; justify-content: center; flex-direction: column; gap: 12px;
        background: #0d0b0e; color: #f2c14e; font: 600 20px system-ui, sans-serif; text-align: center;
      }
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 767px) { #rotate { display: flex } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="rotate"><div style="font-size: 64px">📱↻</div>Vire o celular na horizontal</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
